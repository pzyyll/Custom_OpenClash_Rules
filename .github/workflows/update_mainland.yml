# ABOUTME: Keep the Mainland compatibility template equal to the standard template.
# ABOUTME: Serialize publication with other workflows that write to main.
name: Update Custom_Clash_Mainland.ini

on:
  push:
    branches:
      - main
    paths:
      - cfg/Custom_Clash.ini
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers

jobs:
  update-mainland:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: main
        fetch-depth: 0

    - name: Generate Custom_Clash_Mainland.ini
      run: cp cfg/Custom_Clash.ini cfg/Custom_Clash_Mainland.ini

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add cfg/Custom_Clash_Mainland.ini

        # 确保在 main 分支
        git checkout main

        # 判断是否有变更，只有在有变更时才提交
        if ! git diff --cached --quiet; then
          git commit -m "Update Custom_Clash_Mainland.ini based on Custom_Clash.ini"
          git pull --rebase origin main
          git push origin main
        else
          echo "No changes to commit."
        fi
